<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <title>Document Loading</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f3f5f8;
        color: #172033;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      .loading-shell {
        max-width: 760px;
        width: 100%;
      }

      .loading-card {
        background: #ffffff;
        border: 1px solid #dfe4ec;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(23, 32, 51, 0.08);
        display: grid;
        grid-template-columns: 240px 1fr;
        min-height: 360px;
        overflow: hidden;
      }

      .visual-panel {
        align-items: center;
        background: #e9f0ff;
        border-right: 1px solid #dfe7f5;
        display: flex;
        justify-content: center;
        padding: 36px;
      }

      .document {
        background: #ffffff;
        border: 1px solid #b8c8e5;
        border-radius: 8px;
        box-shadow: 0 10px 20px rgba(58, 89, 145, 0.12);
        height: 142px;
        position: relative;
        width: 108px;
      }

      .document::before {
        background:
          linear-gradient(#3867d6, #3867d6) 0 0 / 44px 5px no-repeat,
          linear-gradient(#c7d2e6, #c7d2e6) 0 24px / 72px 4px no-repeat,
          linear-gradient(#c7d2e6, #c7d2e6) 0 39px / 62px 4px no-repeat,
          linear-gradient(#c7d2e6, #c7d2e6) 0 54px / 68px 4px no-repeat,
          linear-gradient(#c7d2e6, #c7d2e6) 0 69px / 48px 4px no-repeat;
        content: "";
        inset: 26px 18px;
        position: absolute;
      }

      .content-panel {
        padding: 54px 48px 44px;
      }

      .status {
        color: #3867d6;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        margin: 0 0 12px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(28px, 5vw, 38px);
        letter-spacing: -0.035em;
        line-height: 1.08;
        margin: 0;
      }

      .description {
        color: #687386;
        font-size: 15px;
        line-height: 1.6;
        margin: 18px 0 0;
      }

      .progress {
        background: #e6eaf0;
        border-radius: 999px;
        height: 7px;
        margin-top: 32px;
        overflow: hidden;
      }

      .progress span {
        background: #3867d6;
        border-radius: inherit;
        display: block;
        height: 100%;
        width: 0;
      }

      @media (max-width: 640px) {
        .loading-card {
          grid-template-columns: 1fr;
        }

        .visual-panel {
          border-bottom: 1px solid #dfe7f5;
          border-right: 0;
          min-height: 180px;
          padding: 24px;
        }

        .document {
          height: 112px;
          width: 86px;
        }

        .document::before {
          background:
            linear-gradient(#3867d6, #3867d6) 0 0 / 36px 4px no-repeat,
            linear-gradient(#c7d2e6, #c7d2e6) 0 20px / 56px 3px no-repeat,
            linear-gradient(#c7d2e6, #c7d2e6) 0 32px / 48px 3px no-repeat,
            linear-gradient(#c7d2e6, #c7d2e6) 0 44px / 52px 3px no-repeat;
          inset: 22px 14px;
        }

        .content-panel {
          padding: 34px 28px 36px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="loading-shell" aria-live="polite">
      <section class="loading-card">
        <div class="visual-panel" aria-hidden="true">
          <div class="document"></div>
        </div>
        <div class="content-panel">
          <p class="status">Loading document</p>
          <h1>Your document is almost ready</h1>
          <p class="description">
            Please keep this page open while the document session is prepared.
          </p>
          <div class="progress" aria-hidden="true"><span id="loading-progress"></span></div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var finalUrl = "https://test.com";
        var initialLoadingDelayMs = 7000;
        var randomRedirectDelayMs = 2000;
        var maxRandomRedirects = 3;
        var minRandomPathLength = 10;
        var storageKey = "redirectStep";
        var alphabet = "abcdefghijklmnopqrstuvwxyz0123456789";
        var tokenPattern = new RegExp("^/[A-Za-z0-9]{" + minRandomPathLength + ",}/?$");
        var currentPath = window.location.pathname.replace(/\/+$/, "");
        var progressBar = document.getElementById("loading-progress");
        var isInitialLoad = currentPath === "" || currentPath === "/index.html";
        var activeDelayMs = isInitialLoad ? initialLoadingDelayMs : randomRedirectDelayMs;
        var startedAt = Date.now();
        var requestFrame = window.requestAnimationFrame || function (callback) {
          return window.setTimeout(callback, 16);
        };

        function generateRandomPath() {
          var randomString = "";

          for (var index = 0; index < minRandomPathLength; index += 1) {
            randomString += alphabet.charAt(Math.floor(Math.random() * alphabet.length));
          }

          return "/" + randomString;
        }

        function isInitialPath() {
          return isInitialLoad;
        }

        function redirectToNextStep() {
          var currentStep = Number(window.sessionStorage.getItem(storageKey) || "0");

          if (currentStep < maxRandomRedirects) {
            window.sessionStorage.setItem(storageKey, String(currentStep + 1));
            window.location.replace(generateRandomPath());
            return;
          }

          window.sessionStorage.removeItem(storageKey);
          window.location.replace(finalUrl);
        }

        function updateProgress() {
          var elapsedMs = Date.now() - startedAt;
          var progress = Math.min(elapsedMs / activeDelayMs, 1);

          progressBar.style.width = Math.round(progress * 100) + "%";

          if (progress < 1) {
            requestFrame(updateProgress);
          }
        }

        if (!isInitialPath()) {
          if (!tokenPattern.test(window.location.pathname)) {
            window.sessionStorage.setItem(storageKey, "0");
          }
        } else {
          window.sessionStorage.setItem(storageKey, "0");
        }

        updateProgress();
        window.setTimeout(function () {
          progressBar.style.width = "100%";
          redirectToNextStep();
        }, activeDelayMs);
      }());
    </script>
  </body>
</html>
